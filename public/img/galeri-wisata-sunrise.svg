    <g transform="translate(690 616)"><circle cx="12" cy="14" r="13"/><path d="M2 30 L22 30 L28 96 L-4 96 Z"/></g>
    <g transform="translate(760 606)"><circle cx="12" cy="14" r="13"/><path d="M2 30 L22 30 L28 96 L-4 96 Z"/></g>
    <g transform="translate(830 618)"><circle cx="12" cy="14" r="13"/><path d="M2 30 L22 30 L28 96 L-4 96 Z"/></g>
    <g transform="translate(900 608)"><circle cx="12" cy="14" r="13"/><path d="M2 30 L22 30 L28 96 L-4 96 Z"/></g>
  </g>
  <!-- tenda camping -->
  <g transform="translate(1050 640)">
    <path d="M0 80 L60 0 L120 80 Z" fill="#5c5340"/>
    <path d="M60 0 L60 80 L30 80 Z" fill="#4a4230"/>
