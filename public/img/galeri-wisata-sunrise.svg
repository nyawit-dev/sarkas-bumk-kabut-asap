<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Kelompok wisatawan menunggu matahari terbit di titik puncak diterja kabut">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4b184"/>
      <stop offset="1" stop-color="#b89a6d"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1180" cy="240" r="90" fill="#e8c48a" opacity=".5" filter="url(#soft)"/>
  <path d="M0 480 L260 400 L520 470 L820 380 L1120 460 L1400 400 L1600 450 L1600 640 L0 640 Z" fill="#8d7c62" opacity=".4" filter="url(#soft)"/>
  <path d="M0 620 L1600 580 L1600 900 L0 900 Z" fill="#7a7256"/>
  <g stroke="#6a6349" stroke-width="3" opacity=".5">
    <path d="M-100 720 L1700 672"/><path d="M-100 800 L1700 746"/>
  </g>
  <!-- bukit tempat berdiri wisatawan -->
  <path d="M300 700 Q800 520 1400 700 L1400 900 L300 900 Z" fill="#655c45"/>
