<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Lambang resmi PT Kabut Asap dan Wisata Napas">
  <defs>
    <linearGradient id="seal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f7a45"/>
      <stop offset="1" stop-color="#134a2b"/>
    </linearGradient>
  </defs>
  <!-- cincin luar -->
  <circle cx="200" cy="200" r="190" fill="url(#seal)"/>
  <circle cx="200" cy="200" r="170" fill="none" stroke="#f2ede0" stroke-width="3"/>
  <circle cx="200" cy="200" r="162" fill="none" stroke="#f2ede0" stroke-width="1.5" opacity=".7"/>
  <!-- lingkaran dalam -->
  <circle cx="200" cy="200" r="128" fill="#f7f4ea"/>
  <circle cx="200" cy="200" r="128" fill="none" stroke="#1f7a45" stroke-width="2.5"/>

  <!-- teks melingkar atas -->
  <path id="arcTop" d="M 78,200 A 122,122 0 0 1 322,200" fill="none"/>
  <text font-family="Georgia, serif" font-size="27" font-weight="bold" fill="#f2ede0" letter-spacing="3">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">PT KAW N</textPath>
  </text>
  <!-- teks melingkar bawah -->
  <path id="arcBottom" d="M 322,200 A 122,122 0 0 1 78,200" fill="none"/>
  <text font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#cfe3d4" letter-spacing="4">
    <textPath href="#arcBottom" startOffset="50%" text-anchor="middle">DESA KONOHA</textPath>
  </text>

  <!-- ikon tengah: matahari di balik kabut -->
  <g>
    <!-- kabut -->
    <path d="M120 250 Q150 232 180 250 T240 250 T300 248 L300 280 L120 280 Z" fill="#1f7a45" opacity=".9"/>
    <path d="M112 268 Q146 250 184 270 T248 268 T308 266 L308 290 L112 290 Z" fill="#134a2b" opacity=".9"/>
    <!-- matahari -->
    <circle cx="200" cy="196" r="42" fill="#e0a83c"/>
    <circle cx="200" cy="196" r="42" fill="none" stroke="#b57f22" stroke-width="3"/>
    <g stroke="#e0a83c" stroke-width="5" stroke-linecap="round">
      <line x1="200" y1="138" x2="200" y2="126"/>
      <line x1="152" y1="160" x2="143" y2="151"/>
      <line x1="248" y1="160" x2="257" y2="151"/>
      <line x1="140" y1="196" x2="128" y2="196"/>
      <line x1="260" y1="196" x2="272" y2="196"/>
    </g>
    <!-- partikel kabut -->
    <g fill="#134a2b" opacity=".55">
      <circle cx="150" cy="246" r="3"/><circle cx="220" cy="252" r="2.5"/><circle cx="262" cy="244" r="3"/>
    </g>
  </g>
</svg>
