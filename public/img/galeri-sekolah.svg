<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Sekolah dasar dengan anak-anak memakai masker">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c5a878"/>
      <stop offset="1" stop-color="#a08a68"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- gedung sekolah -->
  <rect x="380" y="300" width="840" height="320" fill="#e8e2d2"/>
  <rect x="380" y="300" width="840" height="320" fill="none" stroke="#8a8272" stroke-width="6"/>
  <polygon points="340,300 800,180 1260,300" fill="#8a3b32"/>
  <polygon points="340,300 800,180 1260,300" fill="none" stroke="#6b2b24" stroke-width="5"/>
  <!-- papan nama -->
  <rect x="620" y="330" width="360" height="70" rx="8" fill="#8a3b32"/>
  <text x="800" y="378" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="32" fill="#f2ede0">SD KONOHA 1</text>
  <!-- jendela -->
  <g fill="#c9d8dd" stroke="#8a8272" stroke-width="4">
    <rect x="430" y="440" width="130" height="100"/><rect x="610" y="440" width="130" height="100"/>
    <rect x="860" y="440" width="130" height="100"/><rect x="1040" y="440" width="130" height="100"/>
  </g>
  <!-- pintu -->
  <rect x="760" y="500" width="100" height="120" fill="#5a4632"/>
  <!-- anak-anak berbaris dengan masker -->
  <g>
    <g transform="translate(200 560)">
      <circle cx="16" cy="16" r="15" fill="#4a443b"/>
      <rect x="8" y="6" width="18" height="12" rx="3" fill="#d8d2c4"/>
      <path d="M4 34 L28 34 L32 90 L0 90 Z" fill="#3e5a7a"/>
    </g>
    <g transform="translate(270 560)">
      <circle cx="16" cy="16" r="15" fill="#4a443b"/>
      <rect x="8" y="6" width="18" height="12" rx="3" fill="#d8d2c4"/>
      <path d="M4 34 L28 34 L32 90 L0 90 Z" fill="#a8563c"/>
    </g>
    <g transform="translate(340 560)">
      <circle cx="16" cy="16" r="15" fill="#4a443b"/>
      <rect x="8" y="6" width="18" height="12" rx="3" fill="#d8d2c4"/>
      <path d="M4 34 L28 34 L32 90 L0 90 Z" fill="#5c6e4a"/>
    </g>
    <g transform="translate(1240 560)">
      <circle cx="16" cy="16" r="15" fill="#4a443b"/>
      <rect x="8" y="6" width="18" height="12" rx="3" fill="#d8d2c4"/>
      <path d="M4 34 L28 34 L32 90 L0 90 Z" fill="#6b5a8c"/>
    </g>
    <g transform="translate(1310 560)">
      <circle cx="16" cy="16" r="15" fill="#4a443b"/>
      <rect x="8" y="6" width="18" height="12" rx="3" fill="#d8d2c4"/>
      <path d="M4 34 L28 34 L32 90 L0 90 Z" fill="#3e5a7a"/>
    </g>
    <g transform="translate(1380 560)">
      <circle cx="16" cy="16" r="15" fill="#4a443b"/>
      <rect x="8" y="6" width="18" height="12" rx="3" fill="#d8d2c4"/>
      <path d="M4 34 L28 34 L32 90 L0 90 Z" fill="#a8563c"/>
    </g>
  </g>
  <!-- tanah -->
  <rect y="650" width="1600" height="250" fill="#7a7256"/>
  <!-- kabut -->
  <rect y="560" width="1600" height="340" fill="#7d6a50" opacity=".45"/>
  <ellipse cx="800" cy="660" rx="800" ry="60" fill="#99866b" opacity=".5"/>
</svg>
