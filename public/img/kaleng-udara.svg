    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dfe3e5"/>
      <stop offset="1" stop-color="#a8adb1"/>
    </linearGradient>
  </defs>

  <!-- bayangan -->
  <ellipse cx="400" cy="855" rx="180" ry="22" fill="#000" opacity=".18"/>

  <!-- badan kaleng -->
  <path d="M260 180 C260 120 300 96 400 96 C500 96 540 120 540 180 L540 800 C540 840 500 856 400 856 C300 856 260 840 260 800 Z" fill="url(#metal)"/>
  <!-- tutup -->
  <ellipse cx="400" cy="150" rx="140" ry="42" fill="url(#top)"/>
  <ellipse cx="400" cy="146" rx="118" ry="32" fill="#c3c8cb"/>
  <ellipse cx="400" cy="144" rx="96" ry="24" fill="#b0b6ba"/>
  <rect x="370" y="112" width="60" height="14" rx="7" fill="#8f9599"/>

  <!-- label -->
  <path d="M262 300 C262 292 540 292 540 300 L540 640 C540 648 262 648 262 640 Z" fill="url(#label)"/>
  <!-- kilau label -->
  <path d="M262 300 C262 292 540 292 540 300 L540 340 C400 356 262 340 262 340 Z" fill="#ffffff" opacity=".08"/>

  <!-- teks label -->
  <text x="400" y="372" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="46" fill="#f2ede0">DESA KONOHA</text>
  <text x="400" y="416" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" letter-spacing="6" fill="#cfe3d4">UDARA PREMIUM</text>
  <line x1="320" y1="444" x2="480" y2="444" stroke="#cfe3d4" stroke-width="1.5" opacity=".6"/>
  <text x="400" y="492" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#e8f2ea">Kemasan Kaleng 400 ml</text>
  <text x="400" y="524" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#bcd6c4">Dikemas di sumber · Stok terbatas</text>
  <text x="400" y="596" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="30" fill="#f2ede0">Rp 12.500</text>
  <text x="400" y="622" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="2" fill="#bcd6c4">PT KAW N · BUMK</text>

  <!-- pita bawah logam -->
  <path d="M262 660 C262 652 540 652 540 660 L540 668 C540 676 262 676 262 668 Z" fill="#b9bec2" opacity=".8"/>
  <!-- kilau badan -->
  <path d="M300 180 C292 300 292 700 300 800 L322 800 C314 700 314 300 322 180 Z" fill="#ffffff" opacity=".35"/>
  <path d="M470 180 C462 300 462 700 470 800 L486 800 C478 700 478 300 486 180 Z" fill="#ffffff" opacity=".18"/>
