<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" role="img" aria-label="Kaleng udara kemasan premium merek Desa Konoha">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9aa0a6"/>
      <stop offset=".18" stop-color="#e8eaec"/>
      <stop offset=".5" stop-color="#c6cacd"/>
      <stop offset=".82" stop-color="#eef0f1"/>
      <stop offset="1" stop-color="#878d93"/>
    </linearGradient>
    <linearGradient id="label" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f7a45"/>
      <stop offset="1" stop-color="#14572f"/>
