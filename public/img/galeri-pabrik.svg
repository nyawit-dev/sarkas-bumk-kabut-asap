<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Pabrik pengemasan udara sederhana dengan jalur produksi">
  <rect width="1600" height="900" fill="#c4bda9"/>
  <!-- interior pabrik -->
  <rect y="0" width="1600" height="600" fill="#d0c8b4"/>
  <!-- atap bergelombang -->
  <g fill="#b8b0a0">
    <rect x="0" y="0" width="1600" height="60"/>
    <rect x="0" y="60" width="1600" height="40" fill="#a8a090"/>
  </g>
  <!-- jendela -->
  <g fill="#c9d8dd" stroke="#8a8272" stroke-width="4">
    <rect x="100" y="120" width="180" height="120"/><rect x="340" y="120" width="180" height="120"/>
    <rect x="1080" y="120" width="180" height="120"/><rect x="1320" y="120" width="180" height="120"/>
  </g>
  <!-- mesin pengemas -->
  <g>
    <rect x="620" y="280" width="360" height="220" rx="10" fill="#5a5346"/>
    <rect x="640" y="300" width="320" height="80" rx="6" fill="#3a3128"/>
    <text x="800" y="350" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="26" fill="#1f7a45">PRODUKSI: AKTIF</text>
    <!-- lampu -->
    <circle cx="680" cy="420" r="12" fill="#1f7a45"/>
    <circle cx="720" cy="420" r="12" fill="#1f7a45" opacity=".5"/>
    <circle cx="760" cy="420" r="12" fill="#8a8272"/>
    <!-- meteran -->
    <rect x="820" y="410" width="120" height="26" rx="4" fill="#cfe3d4"/>
    <text x="880" y="430" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="16" fill="#134a2b">400ml</text>
  </g>
  <!-- jalur conveyor -->
  <rect x="200" y="520" width="1200" height="40" rx="8" fill="#3a3128"/>
  <g fill="#8a8272">
    <circle cx="260" cy="575" r="20"/><circle cx="560" cy="575" r="20"/><circle cx="860" cy="575" r="20"/><circle cx="1160" cy="575" r="20"/>
  </g>
  <!-- kaleng di conveyor -->
  <g>
    <g transform="translate(300 440)">
      <rect x="0" y="20" width="36" height="60" rx="5" fill="#c6cacd"/><rect x="0" y="38" width="36" height="26" fill="#1f7a45"/><ellipse cx="18" cy="20" rx="18" ry="6" fill="#dfe3e5"/>
    </g>
    <g transform="translate(500 440)">
      <rect x="0" y="20" width="36" height="60" rx="5" fill="#c6cacd"/><rect x="0" y="38" width="36" height="26" fill="#1f7a45"/><ellipse cx="18" cy="20" rx="18" ry="6" fill="#dfe3e5"/>
    </g>
    <g transform="translate(700 440)">
      <rect x="0" y="20" width="36" height="60" rx="5" fill="#c6cacd"/><rect x="0" y="38" width="36" height="26" fill="#1f7a45"/><ellipse cx="18" cy="20" rx="18" ry="6" fill="#dfe3e5"/>
    </g>
    <g transform="translate(900 440)">
      <rect x="0" y="20" width="36" height="60" rx="5" fill="#c6cacd"/><rect x="0" y="38" width="36" height="26" fill="#1f7a45"/><ellipse cx="18" cy="20" rx="18" ry="6" fill="#dfe3e5"/>
    </g>
    <g transform="translate(1100 440)">
      <rect x="0" y="20" width="36" height="60" rx="5" fill="#c6cacd"/><rect x="0" y="38" width="36" height="26" fill="#1f7a45"/><ellipse cx="18" cy="20" rx="18" ry="6" fill="#dfe3e5"/>
    </g>
  </g>
  <!-- lantai -->
  <rect y="600" width="1600" height="300" fill="#8f8878"/>
  <line x1="0" y1="750" x2="1600" y2="750" stroke="#6e6858" stroke-width="4" opacity=".6"/>
</svg>
