<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Papan pengumuman desa dengan pemberitahuan dari PT KAW N">
  <rect width="1600" height="900" fill="#d0c8b4"/>
  <!-- dinding -->
  <rect y="0" width="1600" height="900" fill="#c4bda9"/>
  <!-- papan pengumuman -->
  <rect x="200" y="100" width="1200" height="560" rx="14" fill="#8a8272"/>
  <rect x="230" y="130" width="1140" height="500" rx="8" fill="#f7f4ea"/>
  <!-- atap papan -->
  <polygon points="160,110 800,40 1440,110" fill="#5a4632"/>
  <!-- pengumuman 1 -->
  <g transform="translate(280 180)">
    <rect x="0" y="0" width="500" height="180" fill="#fbf9f2" stroke="#c4bda9" stroke-width="2"/>
    <rect x="0" y="0" width="500" height="44" fill="#1f7a45"/>
    <text x="250" y="30" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="22" fill="#f2ede0">PENGUMUMAN</text>
    <text x="20" y="80" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#134a2b">Jadwal tur matahari</text>
    <text x="20" y="110" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#5a5346">Dibuka setiap hari Minggu,</text>
    <text x="20" y="134" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#5a5346">kuota 40 orang. Pendaftaran</text>
    <text x="20" y="158" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#5a5346">di kantor PT KAW N.</text>
  </g>
  <!-- pengumuman 2 -->
  <g transform="translate(820 180)">
    <rect x="0" y="0" width="500" height="180" fill="#fbf9f2" stroke="#c4bda9" stroke-width="2"/>
    <rect x="0" y="0" width="500" height="44" fill="#b3352b"/>
    <text x="250" y="30" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="22" fill="#f2ede0">PENTING</text>
    <text x="20" y="80" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#134a2b">Kenaikan harga udara</text>
    <text x="20" y="110" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#5a5346">Harga kaleng disesuaikan</text>
    <text x="20" y="134" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#5a5346">dengan tingkat kabut harian.</text>
    <text x="20" y="158" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#5a5346">Terima kasih atas pengertian.</text>
  </g>
  <!-- pengumuman 3 (kecil) -->
  <g transform="translate(280 400)">
    <rect x="0" y="0" width="500" height="180" fill="#fbf9f2" stroke="#c4bda9" stroke-width="2"/>
    <rect x="0" y="0" width="500" height="44" fill="#5a5346"/>
    <text x="250" y="30" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="22" fill="#f2ede0">INFORMASI</text>
    <text x="20" y="80" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#134a2b">Program Napas Bersama</text>
    <text x="20" y="110" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#5a5346">Tahap perencanaan. Estimasi</text>
    <text x="20" y="134" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#5a5346">pelaksanaan 2031. Warga</text>
    <text x="20" y="158" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#5a5346">diharapkan bersabar.</text>
  </g>
  <!-- pengumuman 4 -->
  <g transform="translate(820 400)">
    <rect x="0" y="0" width="500" height="180" fill="#fbf9f2" stroke="#c4bda9" stroke-width="2"/>
    <rect x="0" y="0" width="500" height="44" fill="#e0a83c"/>
    <text x="250" y="30" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="22" fill="#5a4632">PENGUMUMAN</text>
    <text x="20" y="80" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#134a2b">Rapat warga</text>
    <text x="20" y="110" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#5a5346">Dijadwalkan ulang karena</text>
    <text x="20" y="134" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#5a5346">pengurus menghadiri rapat</text>
    <text x="20" y="158" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#5a5346">koordinasi di luar negeri.</text>
  </g>
  <!-- tiang papan -->
  <rect x="380" y="660" width="30" height="160" fill="#5a4632"/>
  <rect x="1190" y="660" width="30" height="160" fill="#5a4632"/>
  <rect y="800" width="1600" height="100" fill="#9c8f74"/>
</svg>
