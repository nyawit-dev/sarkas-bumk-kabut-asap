<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Pembeli membeli kaleng udara di toko kelontong">
  <rect width="1600" height="900" fill="#d8d2c4"/>
  <!-- interior toko -->
  <rect y="0" width="1600" height="620" fill="#e0dac8"/>
  <!-- rak belakang -->
  <g>
    <rect x="100" y="140" width="480" height="30" fill="#8a8272"/>
    <rect x="100" y="290" width="480" height="30" fill="#8a8272"/>
    <rect x="100" y="440" width="480" height="30" fill="#8a8272"/>
    <g fill="#c4bda9">
      <rect x="120" y="100" width="60" height="40"/><rect x="200" y="100" width="60" height="40"/><rect x="280" y="100" width="60" height="40"/>
      <rect x="120" y="250" width="60" height="40"/><rect x="200" y="250" width="60" height="40"/><rect x="280" y="250" width="60" height="40"/>
      <rect x="120" y="400" width="60" height="40"/><rect x="200" y="400" width="60" height="40"/><rect x="280" y="400" width="60" height="40"/>
    </g>
  </g>
  <!-- papan harga kaleng -->
  <g transform="translate(900 120)">
    <rect x="0" y="0" width="420" height="160" rx="10" fill="#f2ede0" stroke="#1f7a45" stroke-width="6"/>
    <text x="210" y="50" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#5a5346">UDARA KALENG PREMIUM</text>
    <text x="210" y="105" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="44" fill="#b3352b">Rp 12.500</text>
    <text x="210" y="140" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#8a8272">stok menyesuaikan kabut</text>
  </g>
  <!-- etalase kaleng -->
  <rect x="700" y="340" width="700" height="180" rx="10" fill="#9c7f5c"/>
  <rect x="700" y="340" width="700" height="16" rx="8" fill="#8a6f4e"/>
  <g>
    <g transform="translate(740 260)">
      <rect x="0" y="20" width="42" height="76" rx="6" fill="#c6cacd"/><rect x="0" y="42" width="42" height="32" fill="#1f7a45"/><ellipse cx="21" cy="20" rx="21" ry="7" fill="#dfe3e5"/>
    </g>
    <g transform="translate(810 260)">
      <rect x="0" y="20" width="42" height="76" rx="6" fill="#c6cacd"/><rect x="0" y="42" width="42" height="32" fill="#1f7a45"/><ellipse cx="21" cy="20" rx="21" ry="7" fill="#dfe3e5"/>
    </g>
    <g transform="translate(880 260)">
      <rect x="0" y="20" width="42" height="76" rx="6" fill="#c6cacd"/><rect x="0" y="42" width="42" height="32" fill="#1f7a45"/><ellipse cx="21" cy="20" rx="21" ry="7" fill="#dfe3e5"/>
    </g>
    <g transform="translate(1030 260)">
      <rect x="0" y="20" width="42" height="76" rx="6" fill="#c6cacd"/><rect x="0" y="42" width="42" height="32" fill="#1f7a45"/><ellipse cx="21" cy="20" rx="21" ry="7" fill="#dfe3e5"/>
    </g>
    <g transform="translate(1100 260)">
      <rect x="0" y="20" width="42" height="76" rx="6" fill="#c6cacd"/><rect x="0" y="42" width="42" height="32" fill="#1f7a45"/><ellipse cx="21" cy="20" rx="21" ry="7" fill="#dfe3e5"/>
    </g>
    <g transform="translate(1170 260)">
      <rect x="0" y="20" width="42" height="76" rx="6" fill="#c6cacd"/><rect x="0" y="42" width="42" height="32" fill="#1f7a45"/><ellipse cx="21" cy="20" rx="21" ry="7" fill="#dfe3e5"/>
    </g>
    <g transform="translate(1290 260)">
      <rect x="0" y="20" width="42" height="76" rx="6" fill="#c6cacd"/><rect x="0" y="42" width="42" height="32" fill="#1f7a45"/><ellipse cx="21" cy="20" rx="21" ry="7" fill="#dfe3e5"/>
    </g>
  </g>
  <!-- pembeli -->
  <g fill="#2c2a26">
    <g transform="translate(560 380)"><circle cx="20" cy="20" r="19"/><path d="M4 44 L36 44 L44 120 L-4 120 Z"/></g>
  </g>
  <!-- lantai -->
