<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Konferensi pers PT KAW N dengan spanduk dan meja wartawan">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f7a45"/>
      <stop offset="1" stop-color="#134a2b"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- motif kabut di latar -->
  <g fill="#ffffff" opacity=".05">
    <ellipse cx="300" cy="200" rx="300" ry="80"/>
    <ellipse cx="1200" cy="260" rx="340" ry="70"/>
  </g>
  <!-- spanduk -->
  <rect x="300" y="80" width="1000" height="200" rx="12" fill="#f2ede0"/>
  <text x="800" y="160" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="52" fill="#134a2b">PT KAW N</text>
  <text x="800" y="215" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28" letter-spacing="4" fill="#1f7a45">KONFERENSI PERS TAHUNAN</text>
  <!-- lambang -->
  <circle cx="230" cy="180" r="52" fill="#f2ede0"/>
  <circle cx="230" cy="180" r="40" fill="#1f7a45"/>
  <circle cx="230" cy="174" r="16" fill="#e0a83c"/>
  <path d="M196 196 Q214 186 230 196 T264 194 L264 208 L196 208 Z" fill="#134a2b"/>
  <circle cx="1370" cy="180" r="52" fill="#f2ede0"/>
  <circle cx="1370" cy="180" r="40" fill="#1f7a45"/>
  <circle cx="1370" cy="174" r="16" fill="#e0a83c"/>
  <path d="M1336 196 Q1354 186 1370 196 T1404 194 L1404 208 L1336 208 Z" fill="#134a2b"/>
  <!-- mimbar -->
  <rect x="620" y="420" width="360" height="120" rx="10" fill="#4a3c28"/>
  <rect x="620" y="420" width="360" height="20" rx="10" fill="#6b5738"/>
  <text x="800" y="500" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="30" fill="#f2ede0">PT KAW N</text>
  <!-- mikrofon -->
  <line x1="800" y1="420" x2="800" y2="360" stroke="#2c2a26" stroke-width="6"/>
  <ellipse cx="800" cy="352" rx="14" ry="20" fill="#2c2a26"/>
  <!-- pembicara di mimbar (siluet) -->
  <g fill="#2c2a26" opacity=".85">
    <circle cx="800" cy="380" r="0"/>
  </g>
  <!-- baris meja wartawan -->
  <g>
    <rect x="150" y="640" width="1300" height="70" rx="10" fill="#3a3128"/>
    <rect x="150" y="640" width="1300" height="14" rx="7" fill="#5a5346"/>
  </g>
  <!-- wartawan: kepala + laptop -->
  <g fill="#2c2a26">
    <g transform="translate(300 560)"><circle cx="20" cy="20" r="18"/><path d="M4 44 L36 44 L44 80 L-4 80 Z"/></g>
    <g transform="translate(520 560)"><circle cx="20" cy="20" r="18"/><path d="M4 44 L36 44 L44 80 L-4 80 Z"/></g>
    <g transform="translate(740 560)"><circle cx="20" cy="20" r="18"/><path d="M4 44 L36 44 L44 80 L-4 80 Z"/></g>
    <g transform="translate(960 560)"><circle cx="20" cy="20" r="18"/><path d="M4 44 L36 44 L44 80 L-4 80 Z"/></g>
    <g transform="translate(1180 560)"><circle cx="20" cy="20" r="18"/><path d="M4 44 L36 44 L44 80 L-4 80 Z"/></g>
  </g>
  <!-- laptop wartawan -->
  <g fill="#565049">
    <path d="M290 640 L302 612 L338 612 L350 640 Z"/>
    <path d="M510 640 L522 612 L558 612 L570 640 Z"/>
    <path d="M730 640 L742 612 L778 612 L790 640 Z"/>
    <path d="M950 640 L962 612 L998 612 L1010 640 Z"/>
    <path d="M1170 640 L1182 612 L1218 612 L1230 640 Z"/>
  </g>
  <!-- lantai -->
  <rect y="710" width="1600" height="190" fill="#0f3d22"/>
</svg>
