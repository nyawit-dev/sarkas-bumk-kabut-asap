<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Karyawan PT KAW N bekerja di kantor kecil">
  <rect width="1600" height="900" fill="#e0dac8"/>
  <!-- dinding -->
  <rect y="0" width="1600" height="700" fill="#e8e2d2"/>
  <!-- jendela dengan pemandangan berkabut -->
  <g>
    <rect x="120" y="120" width="420" height="280" fill="#b89a6d" stroke="#8a8272" stroke-width="8"/>
    <line x1="330" y1="120" x2="330" y2="400" stroke="#8a8272" stroke-width="6"/>
    <rect x="1060" y="120" width="420" height="280" fill="#b89a6d" stroke="#8a8272" stroke-width="8"/>
    <line x1="1270" y1="120" x2="1270" y2="400" stroke="#8a8272" stroke-width="6"/>
  </g>
  <!-- papan nama di dinding -->
  <rect x="620" y="140" width="360" height="120" rx="10" fill="#1f7a45"/>
  <text x="800" y="195" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="34" fill="#f2ede0">KANTOR PT KAW N</text>
  <text x="800" y="230" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#cfe3d4">Jam kerja: 08.00–14.00 WIB</text>
  <text x="800" y="252" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#cfe3d4">(atau hingga kabut terlalu tebal)</text>
  <!-- meja kerja -->
  <rect x="200" y="560" width="1200" height="40" rx="6" fill="#9c7f5c"/>
  <rect x="240" y="600" width="30" height="100" fill="#8a6f4e"/>
  <rect x="1330" y="600" width="30" height="100" fill="#8a6f4e"/>
  <!-- karyawan 1 dengan komputer -->
  <g fill="#2c2a26">
    <g transform="translate(420 420)">
      <circle cx="20" cy="20" r="19"/><path d="M4 44 L36 44 L44 140 L-4 140 Z"/>
    </g>
  </g>
  <path d="M400 560 L470 560 L460 520 L410 520 Z" fill="#565049"/>
  <!-- karyawan 2 -->
  <g fill="#3e382c">
    <g transform="translate(760 420)">
      <circle cx="20" cy="20" r="19"/><path d="M4 44 L36 44 L44 140 L-4 140 Z"/>
    </g>
  </g>
  <!-- tumpukan berkas di meja -->
  <g>
    <rect x="580" y="530" width="120" height="30" fill="#f2ede0" stroke="#8a8272" stroke-width="2"/>
    <rect x="585" y="516" width="120" height="30" fill="#fbf9f2" stroke="#8a8272" stroke-width="2"/>
    <rect x="590" y="502" width="120" height="30" fill="#f2ede0" stroke="#8a8272" stroke-width="2"/>
  </g>
  <!-- telepon -->
  <g transform="translate(1000 520)">
    <rect x="0" y="0" width="70" height="40" rx="6" fill="#3a3128"/>
    <rect x="8" y="8" width="54" height="16" rx="3" fill="#cfe3d4"/>
  </g>
  <!-- tanaman kecil -->
  <g transform="translate(1180 490)">
    <rect x="0" y="40" width="50" height="30" rx="4" fill="#8a8272"/>
    <path d="M10 40 Q6 20 25 6 Q44 20 40 40" fill="#1f7a45"/>
  </g>
  <!-- lantai -->
  <rect y="700" width="1600" height="200" fill="#b8b0a0"/>
  <line x1="0" y1="800" x2="1600" y2="800" stroke="#a8a090" stroke-width="3"/>
</svg>
