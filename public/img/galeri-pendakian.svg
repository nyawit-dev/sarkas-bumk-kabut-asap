<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Jalur pendakian bukit menuju titik wisata matahari">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b89a6d"/>
      <stop offset="1" stop-color="#8f7d5e"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- puncak bukit -->
  <path d="M0 620 Q400 380 800 340 Q1200 300 1600 560 L1600 900 L0 900 Z" fill="#6b6248"/>
  <!-- jalur pendakian berkelok -->
  <path d="M600 900 Q680 780 560 700 Q440 620 560 540 Q660 480 780 420" fill="none" stroke="#9c8f74" stroke-width="26" stroke-linecap="round"/>
  <path d="M600 900 Q680 780 560 700 Q440 620 560 540 Q660 480 780 420" fill="none" stroke="#b8a888" stroke-width="16" stroke-linecap="round" stroke-dasharray="2 30"/>
  <!-- papan petunjuk di puncak -->
  <g transform="translate(760 300)">
    <rect x="0" y="0" width="10" height="100" fill="#5a4632"/>
    <rect x="-30" y="-50" width="120" height="56" rx="6" fill="#f2ede0" stroke="#8a8272" stroke-width="3"/>
    <text x="30" y="-26" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#134a2b">PUNCAK WISATA</text>
    <text x="30" y="-8" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5a5346">03.00 WIB</text>
    <!-- tanda panah -->
    <path d="M-10 -22 L-26 -22 M-20 -30 L-26 -22 L-20 -14" stroke="#134a2b" stroke-width="3" fill="none"/>
  </g>
  <!-- pendaki di jalur -->
  <g fill="#3e382c">
    <g transform="translate(700 780)"><circle cx="12" cy="12" r="11"/><path d="M3 26 L21 26 L25 70 L-1 70 Z"/></g>
    <g transform="translate(770 700)"><circle cx="12" cy="12" r="11"/><path d="M3 26 L21 26 L25 70 L-1 70 Z"/></g>
    <g transform="translate(690 620)"><circle cx="12" cy="12" r="11"/><path d="M3 26 L21 26 L25 70 L-1 70 Z"/></g>
  </g>
  <!-- ransel -->
  <rect x="716" y="800" width="16" height="22" rx="4" fill="#8a3b32"/>
  <rect x="786" y="720" width="16" height="22" rx="4" fill="#3e5a7a"/>
  <!-- pepohonan di sisi -->
  <g fill="#4a4230" opacity=".85">
    <g transform="translate(200 620) scale(1.4)">
      <rect x="0" y="0" width="14" height="80" fill="#5a4632"/>
      <circle cx="7" cy="-16" r="40"/>
    </g>
    <g transform="translate(1300 640) scale(1.3)">
      <rect x="0" y="0" width="14" height="80" fill="#5a4632"/>
      <circle cx="7" cy="-16" r="38"/>
    </g>
  </g>
  <!-- kabut di puncak -->
  <ellipse cx="800" cy="420" rx="420" ry="70" fill="#99866b" opacity=".5"/>
  <ellipse cx="400" cy="600" rx="500" ry="60" fill="#99866b" opacity=".4"/>
</svg>
