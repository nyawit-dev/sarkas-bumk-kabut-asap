<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Rumah warga berdampingan dengan cerobong asap">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a89478"/>
      <stop offset="1" stop-color="#8a7460"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- cerobong asap -->
  <g>
    <rect x="1050" y="280" width="90" height="420" fill="#8a3b32"/>
    <rect x="1040" y="260" width="110" height="30" fill="#6b2b24"/>
    <!-- asap mengepul -->
    <g fill="#6f6149" opacity=".55">
      <circle cx="1095" cy="220" r="34"/>
      <circle cx="1120" cy="170" r="42"/>
      <circle cx="1080" cy="110" r="50"/>
      <circle cx="1130" cy="50" r="58"/>
    </g>
    <!-- kilau cerobong -->
    <rect x="1062" y="290" width="14" height="400" fill="#a85646" opacity=".6"/>
  </g>
  <!-- pabrik/gedung industri -->
  <rect x="950" y="480" width="320" height="220" fill="#6d5b45"/>
  <polygon points="950,480 1110,420 1270,480" fill="#5d4d3a"/>
  <g fill="#c9d8dd" stroke="#5a5346" stroke-width="3">
    <rect x="990" y="520" width="70" height="60"/><rect x="1090" y="520" width="70" height="60"/><rect x="1190" y="520" width="60" height="60"/>
  </g>
  <!-- rumah warga sederhana -->
  <g>
    <rect x="240" y="480" width="300" height="220" fill="#d8d2c4"/>
    <polygon points="200,480 390,380 580,480" fill="#8a3b32"/>
    <rect x="350" y="560" width="80" height="140" fill="#5a4632"/>
    <rect x="270" y="520" width="60" height="60" fill="#c9d8dd" stroke="#8a8272" stroke-width="4"/>
    <rect x="450" y="520" width="60" height="60" fill="#c9d8dd" stroke="#8a8272" stroke-width="4"/>
  </g>
  <!-- pohon -->
  <g fill="#4a4230">
    <g transform="translate(680 520)">
      <rect x="0" y="0" width="16" height="100" fill="#5a4632"/>
      <circle cx="8" cy="-20" r="46"/>
    </g>
    <g transform="translate(760 540)">
      <rect x="0" y="0" width="14" height="80" fill="#5a4632"/>
      <circle cx="7" cy="-16" r="38"/>
    </g>
  </g>
  <!-- tanah -->
  <rect y="700" width="1600" height="200" fill="#6e684f"/>
  <!-- kabut menyelimuti -->
  <rect y="560" width="1600" height="340" fill="#7d6a50" opacity=".45"/>
  <ellipse cx="800" cy="680" rx="800" ry="60" fill="#99866b" opacity=".5"/>
</svg>
