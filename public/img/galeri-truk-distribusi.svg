<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Truk membawa kaleng udara melintas jalan desa berbekab">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8ab7c"/>
      <stop offset="1" stop-color="#ab9370"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#57534c"/>
      <stop offset="1" stop-color="#403c36"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- pepohonan samar -->
  <g fill="#6f6149" opacity=".4">
    <circle cx="120" cy="420" r="60"/><circle cx="210" cy="440" r="48"/><circle cx="1440" cy="410" r="56"/><circle cx="1360" cy="440" r="44"/>
  </g>
  <!-- rumah pinggir jalan -->
  <g opacity=".5">
    <rect x="200" y="430" width="150" height="90" fill="#6d5b45"/>
    <polygon points="200,430 275,380 350,430" fill="#5d4d3a"/>
    <rect x="1180" y="440" width="130" height="80" fill="#6d5b45"/>
    <polygon points="1180,440 1245,395 1310,440" fill="#5d4d3a"/>
  </g>
  <rect y="580" width="1600" height="320" fill="url(#road)"/>
  <line x1="0" y1="790" x2="1600" y2="790" stroke="#d8d2c4" stroke-width="6" stroke-dasharray="60 44" opacity=".6"/>
  <!-- truk box -->
  <g transform="translate(420 380)">
    <!-- bak -->
    <rect x="120" y="120" width="520" height="240" rx="10" fill="#f2ede0"/>
    <rect x="120" y="120" width="520" height="60" rx="10" fill="#1f7a45"/>
    <text x="380" y="160" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="30" fill="#f2ede0">PT KAW N</text>
    <!-- ikon kaleng di bak -->
    <g transform="translate(230 220)">
      <rect x="0" y="20" width="40" height="90" rx="6" fill="#c6cacd"/>
      <rect x="0" y="50" width="40" height="40" fill="#1f7a45"/>
      <ellipse cx="20" cy="20" rx="20" ry="7" fill="#dfe3e5"/>
    </g>
    <g transform="translate(330 220)">
      <rect x="0" y="20" width="40" height="90" rx="6" fill="#c6cacd"/>
      <rect x="0" y="50" width="40" height="40" fill="#1f7a45"/>
      <ellipse cx="20" cy="20" rx="20" ry="7" fill="#dfe3e5"/>
    </g>
    <g transform="translate(430 220)">
      <rect x="0" y="20" width="40" height="90" rx="6" fill="#c6cacd"/>
      <rect x="0" y="50" width="40" height="40" fill="#1f7a45"/>
      <ellipse cx="20" cy="20" rx="20" ry="7" fill="#dfe3e5"/>
    </g>
    <!-- kabin -->
    <path d="M60 360 L60 180 Q60 140 100 138 L120 138 L120 360 Z" fill="#8a3b32"/>
    <rect x="70" y="150" width="44" height="40" rx="4" fill="#c9c2b4" opacity=".9"/>
    <!-- roda -->
    <circle cx="120" cy="380" r="34" fill="#2c2a26"/><circle cx="120" cy="380" r="16" fill="#8a8272"/>
    <circle cx="560" cy="380" r="34" fill="#2c2a26"/><circle cx="560" cy="380" r="16" fill="#8a8272"/>
    <!-- lampu -->
    <rect x="52" y="300" width="14" height="14" rx="3" fill="#e8d9a0"/>
  </g>
  <rect y="520" width="1600" height="380" fill="#7d6a50" opacity=".3"/>
  <ellipse cx="700" cy="620" rx="700" ry="60" fill="#99866b" opacity=".4"/>
</svg>
