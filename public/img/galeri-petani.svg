<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Petani memakai masker bekerja di sawah diterja kabut">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cbb083"/>
      <stop offset="1" stop-color="#a89070"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- sawah -->
  <path d="M0 520 L1600 500 L1600 900 L0 900 Z" fill="#6e684f"/>
  <g stroke="#5d5741" stroke-width="3" opacity=".55">
    <path d="M-100 620 L1700 590"/><path d="M-100 720 L1700 686"/><path d="M-100 820 L1700 782"/>
    <path d="M260 500 L200 900"/><path d="M700 505 L660 900"/><path d="M1160 502 L1120 900"/>
  </g>
  <!-- bibit padi -->
  <g stroke="#8a8260" stroke-width="3" opacity=".7">
    <path d="M150 700 l6 -18 M170 702 l6 -18 M190 700 l6 -18 M210 702 l6 -18"/>
    <path d="M600 700 l6 -18 M620 702 l6 -18 M640 700 l6 -18 M660 702 l6 -18"/>
    <path d="M1050 700 l6 -18 M1070 702 l6 -18 M1090 700 l6 -18 M1110 702 l6 -18"/>
  </g>
  <!-- petani 1 membungkuk -->
  <g transform="translate(400 560)">
    <circle cx="30" cy="20" r="16" fill="#4a443b"/>
    <rect x="24" y="8" width="26" height="12" rx="4" fill="#d8d2c4"/>
    <path d="M10 40 Q35 30 60 44 L58 100 L12 96 Z" fill="#3e5a3a"/>
    <path d="M12 96 L4 150 M52 96 L62 150" stroke="#3e5a3a" stroke-width="12" stroke-linecap="round"/>
    <path d="M56 60 L120 90" stroke="#4a443b" stroke-width="10" stroke-linecap="round"/>
  </g>
  <!-- petani 2 berdiri dengan cangkul -->
  <g transform="translate(900 540)">
    <circle cx="24" cy="18" r="16" fill="#4a443b"/>
    <rect x="18" y="6" width="26" height="12" rx="4" fill="#d8d2c4"/>
    <path d="M8 38 L40 38 L46 110 L2 110 Z" fill="#5a4632"/>
    <path d="M6 110 L0 160 M42 110 L48 160" stroke="#5a4632" stroke-width="12" stroke-linecap="round"/>
    <line x1="50" y1="30" x2="80" y2="160" stroke="#6b5738" stroke-width="8"/>
    <rect x="72" y="158" width="20" height="12" fill="#8a8272"/>
  </g>
  <!-- topi jerami di tanah -->
  <g transform="translate(700 720)">
    <ellipse cx="30" cy="14" rx="34" ry="10" fill="#c9b184"/>
    <ellipse cx="30" cy="10" rx="16" ry="7" fill="#b89a6d"/>
  </g>
  <!-- kabut -->
  <rect y="440" width="1600" height="300" fill="#7d6a50" opacity=".3"/>
  <ellipse cx="400" cy="560" rx="500" ry="60" fill="#99866b" opacity=".45"/>
  <ellipse cx="1300" cy="600" rx="600" ry="60" fill="#99866b" opacity=".4"/>
  <g fill="#b3a184" opacity=".5">
    <circle cx="200" cy="480" r="4"/><circle cx="600" cy="460" r="5"/><circle cx="1000" cy="490" r="4"/><circle cx="1400" cy="470" r="5"/>
  </g>
</svg>
