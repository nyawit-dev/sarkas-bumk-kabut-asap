<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Stasiun pemantau kualitas udara di Desa Konoha">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2a878"/>
      <stop offset="1" stop-color="#9c8868"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- tanah -->
  <rect y="600" width="1600" height="300" fill="#6e684f"/>
  <!-- tiang pemantau -->
  <rect x="780" y="240" width="40" height="380" fill="#8a8272"/>
  <rect x="760" y="220" width="80" height="30" rx="6" fill="#5a5346"/>
  <!-- kotak instrumen -->
  <rect x="700" y="330" width="200" height="140" rx="10" fill="#f2ede0" stroke="#8a8272" stroke-width="4"/>
  <text x="800" y="365" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="22" fill="#134a2b">KUALITAS UDARA</text>
  <!-- layar -->
  <rect x="725" y="380" width="150" height="60" rx="4" fill="#2c3e2c"/>
  <text x="800" y="425" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="32" fill="#e8a33c">1.240</text>
  <!-- lampu indikator -->
  <circle cx="745" cy="455" r="10" fill="#b3352b"/>
  <circle cx="775" cy="455" r="10" fill="#e8a33c"/>
  <circle cx="805" cy="455" r="10" fill="#1f7a45" opacity=".3"/>
  <text x="835" y="461" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#5a5346">berbahaya</text>
  <!-- panel surya -->
  <g transform="translate(950 380) skewX(-20)">
    <rect x="0" y="0" width="180" height="90" fill="#2c4a6b" stroke="#8a8272" stroke-width="3"/>
    <line x1="60" y1="0" x2="60" y2="90" stroke="#8a8272" stroke-width="2"/>
    <line x1="120" y1="0" x2="120" y2="90" stroke="#8a8272" stroke-width="2"/>
    <line x1="0" y1="45" x2="180" y2="45" stroke="#8a8272" stroke-width="2"/>
  </g>
  <rect x="1020" y="470" width="16" height="150" fill="#8a8272"/>
  <!-- bendera -->
  <rect x="500" y="300" width="10" height="320" fill="#8a8272"/>
  <path d="M510 310 L640 340 L510 380 Z" fill="#1f7a45"/>
  <text x="510" y="285" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#134a2b">PT KAW N</text>
  <!-- pagar -->
  <g stroke="#8a8272" stroke-width="6">
    <line x1="200" y1="640" x2="200" y2="580"/><line x1="300" y1="640" x2="300" y2="580"/>
    <line x1="1400" y1="640" x2="1400" y2="580"/><line x1="1300" y1="640" x2="1300" y2="580"/>
  </g>
  <rect x="180" y="576" width="200" height="8" fill="#8a8272"/>
  <rect x="1280" y="576" width="200" height="8" fill="#8a8272"/>
  <!-- kabut -->
  <rect y="520" width="1600" height="380" fill="#7d6a50" opacity=".4"/>
  <ellipse cx="800" cy="620" rx="800" ry="50" fill="#99866b" opacity=".5"/>
</svg>
