<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Lambang perusahaan di dinding kantor">
  <defs>
    <radialGradient id="spot" cx=".5" cy=".3" r=".8">
      <stop offset="0" stop-color="#3a5a45"/>
      <stop offset="1" stop-color="#1a2e22"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#spot)"/>
  <!-- dinding beton -->
  <g stroke="#0f1f16" stroke-width="3" opacity=".5">
    <line x1="0" y1="300" x2="1600" y2="300"/><line x1="0" y1="600" x2="1600" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="300"/><line x1="1200" y1="0" x2="1200" y2="300"/>
    <line x1="400" y1="600" x2="400" y2="900"/><line x1="1200" y1="600" x2="1200" y2="900"/>
  </g>
  <!-- lambang besar -->
  <g transform="translate(800 400)">
    <circle cx="0" cy="0" r="220" fill="#1f7a45"/>
    <circle cx="0" cy="0" r="196" fill="none" stroke="#f2ede0" stroke-width="5"/>
    <circle cx="0" cy="0" r="186" fill="none" stroke="#f2ede0" stroke-width="2" opacity=".6"/>
    <circle cx="0" cy="0" r="150" fill="#f7f4ea"/>
    <circle cx="0" cy="0" r="150" fill="none" stroke="#1f7a45" stroke-width="4"/>
    <!-- matahari -->
    <circle cx="0" cy="-10" r="52" fill="#e0a83c"/>
    <circle cx="0" cy="-10" r="52" fill="none" stroke="#b57f22" stroke-width="4"/>
    <g stroke="#e0a83c" stroke-width="6" stroke-linecap="round">
      <line x1="0" y1="-80" x2="0" y2="-96"/>
      <line x1="-40" y1="-60" x2="-52" y2="-72"/>
      <line x1="40" y1="-60" x2="52" y2="-72"/>
      <line x1="-62" y1="-10" x2="-78" y2="-10"/>
      <line x1="62" y1="-10" x2="78" y2="-10"/>
    </g>
    <!-- kabut -->
    <path d="M-100 60 Q-60 34 -20 60 T60 56 T100 52 L100 96 L-100 96 Z" fill="#1f7a45" opacity=".9"/>
    <path d="M-110 82 Q-70 58 -20 84 T60 80 T110 76 L110 100 L-110 100 Z" fill="#134a2b" opacity=".9"/>
  </g>
  <!-- pencahayaan -->
  <ellipse cx="800" cy="200" rx="500" ry="120" fill="#ffffff" opacity=".04"/>
</svg>
