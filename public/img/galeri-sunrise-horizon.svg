<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Matahari terbit di ufuk yang samar diterja kabut tebal">
  <defs>
    <radialGradient id="glow" cx=".5" cy=".62" r=".45">
      <stop offset="0" stop-color="#e8b96a"/>
      <stop offset=".5" stop-color="#c9975a" stop-opacity=".6"/>
      <stop offset="1" stop-color="#a87844" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a6f4e"/>
      <stop offset=".55" stop-color="#b8935f"/>
      <stop offset="1" stop-color="#c9a76e"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <!-- matahari tersamar -->
  <circle cx="800" cy="560" r="120" fill="#e8c48a" opacity=".7" filter="url(#soft)"/>
  <circle cx="800" cy="560" r="70" fill="#d4a860" opacity=".8" filter="url(#soft)"/>
  <!-- barisan bukit -->
  <path d="M0 600 L240 540 L480 590 L760 520 L1040 585 L1320 535 L1600 590 L1600 900 L0 900 Z" fill="#6b5c48" opacity=".75" filter="url(#soft)"/>
  <!-- siluet pohon kelapa di puncak -->
  <g fill="#4a4230" opacity=".8">
    <g transform="translate(180 520)">
      <path d="M0 80 Q-4 40 0 0" stroke="#4a4230" stroke-width="10" fill="none"/>
      <path d="M0 0 Q-30 -20 -50 -10 M0 0 Q30 -20 50 -10 M0 0 Q-10 -34 -30 -40 M0 0 Q10 -34 30 -40 M0 0 Q0 -40 0 -50" stroke="#4a4230" stroke-width="7" fill="none"/>
    </g>
    <g transform="translate(1380 530)">
      <path d="M0 80 Q-4 40 0 0" stroke="#4a4230" stroke-width="10" fill="none"/>
      <path d="M0 0 Q-30 -20 -50 -10 M0 0 Q30 -20 50 -10 M0 0 Q-10 -34 -30 -40 M0 0 Q10 -34 30 -40 M0 0 Q0 -40 0 -50" stroke="#4a4230" stroke-width="7" fill="none"/>
    </g>
  </g>
  <!-- sawah bawah -->
  <rect y="700" width="1600" height="200" fill="#5d5741"/>
  <g stroke="#4e4836" stroke-width="3" opacity=".6">
    <path d="M-100 780 L1700 740"/><path d="M-100 850 L1700 810"/>
  </g>
  <!-- kabut tebal -->
  <rect y="560" width="1600" height="340" fill="#7d6a50" opacity=".42"/>
  <ellipse cx="800" cy="640" rx="900" ry="70" fill="#99866b" opacity=".5"/>
  <ellipse cx="400" cy="720" rx="600" ry="50" fill="#99866b" opacity=".4"/>
  <ellipse cx="1300" cy="760" rx="600" ry="50" fill="#99866b" opacity=".35"/>
</svg>
