<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Desa Konoha diterpa kabut tebal, sawah dan langitan samar terlihat">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8b98a"/>
      <stop offset=".45" stop-color="#c2a173"/>
      <stop offset="1" stop-color="#a8906f"/>
    </linearGradient>
    <radialGradient id="sun" cx=".72" cy=".28" r=".22">
      <stop offset="0" stop-color="#f4dcae" stop-opacity=".95"/>
      <stop offset=".6" stop-color="#e0c290" stop-opacity=".35"/>
      <stop offset="1" stop-color="#e0c290" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="haze1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f7d63" stop-opacity=".10"/>
      <stop offset="1" stop-color="#6b5c48" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="haze2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a6a54" stop-opacity=".30"/>
      <stop offset="1" stop-color="#5c4f3e" stop-opacity=".65"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a8264"/>
      <stop offset="1" stop-color="#6e684f"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- langit -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#sun)"/>

  <!-- barisan bukit jauh, makin samar -->
  <path d="M0 470 L180 400 L340 455 L520 380 L700 445 L900 375 L1120 440 L1320 390 L1600 450 L1600 620 L0 620 Z" fill="#8d7c62" opacity=".38" filter="url(#soft)"/>
  <path d="M0 540 L220 490 L420 530 L640 470 L880 520 L1140 465 L1380 515 L1600 480 L1600 700 L0 700 Z" fill="#7d6e57" opacity=".5" filter="url(#soft)"/>

  <!-- desa: atap-atap samar -->
  <g opacity=".55" filter="url(#soft)">
    <rect x="300" y="560" width="46" height="26" fill="#6d5b45"/>
    <polygon points="300,560 323,545 346,560" fill="#5d4d3a"/>
    <rect x="380" y="568" width="52" height="24" fill="#6d5b45"/>
    <polygon points="380,568 406,552 432,568" fill="#5d4d3a"/>
    <rect x="1080" y="562" width="44" height="24" fill="#6d5b45"/>
    <polygon points="1080,562 1102,548 1124,562" fill="#5d4d3a"/>
    <rect x="1160" y="572" width="50" height="22" fill="#6d5b45"/>
    <polygon points="1160,572 1185,558 1210,572" fill="#5d4d3a"/>
  </g>

  <!-- sawah: grid memudar ke bawah -->
  <path d="M0 640 L1600 610 L1600 900 L0 900 Z" fill="url(#field)"/>
  <g stroke="#5d5741" stroke-width="2" opacity=".5">
    <path d="M-100 700 L1700 668"/>
    <path d="M-100 760 L1700 722"/>
    <path d="M-100 830 L1700 786"/>
    <path d="M200 610 L160 900"/>
    <path d="M560 614 L540 900"/>
    <path d="M980 612 L960 900"/>
    <path d="M1380 610 L1360 900"/>
  </g>

  <!-- lapisan kabut -->
  <rect y="420" width="1600" height="300" fill="url(#haze1)"/>
  <rect y="560" width="1600" height="260" fill="url(#haze2)"/>
  <ellipse cx="380" cy="640" rx="520" ry="90" fill="#99866b" opacity=".30" filter="url(#soft)"/>
  <ellipse cx="1250" cy="600" rx="600" ry="80" fill="#99866b" opacity=".24" filter="url(#soft)"/>

  <!-- partikel asap -->
  <g fill="#b3a184" opacity=".5">
    <circle cx="150" cy="380" r="5"/><circle cx="410" cy="330" r="7"/><circle cx="690" cy="420" r="4"/>
    <circle cx="930" cy="300" r="6"/><circle cx="1180" cy="400" r="5"/><circle cx="1420" cy="350" r="7"/>
    <circle cx="250" cy="520" r="6"/><circle cx="560" cy="470" r="4"/><circle cx="860" cy="540" r="6"/>
    <circle cx="1120" cy="490" r="5"/><circle cx="1360" cy="530" r="4"/>
  </g>
</svg>
